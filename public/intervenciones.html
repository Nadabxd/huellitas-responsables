<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intervenciones - HuellasResponsables</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="material-symbols-outlined">pets</span>
            <h2>HuellasResponsables</h2>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a href="mascotas.html" class="nav-item">
                <span class="material-symbols-outlined">pet_supplies</span>
                <span>Mascotas</span>
            </a>
            <a href="adoptantes.html" class="nav-item">
                <span class="material-symbols-outlined">group</span>
                <span>Adoptantes</span>
            </a>
            <a href="seguimientos.html" class="nav-item">
                <span class="material-symbols-outlined">assignment</span>
                <span>Seguimientos</span>
            </a>
            <a href="intervenciones.html" class="nav-item active">
                <span class="material-symbols-outlined">medical_services</span>
                <span>Intervenciones</span>
            </a>
            <a href="reportes.html" class="nav-item">
                <span class="material-symbols-outlined">description</span>
                <span>Reportes</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <span class="material-symbols-outlined">account_circle</span>
                <div>
                    <p id="userName" class="user-name">Admin Centro</p>
                    <p class="user-role">Administrador</p>
                </div>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Control de Bienestar e Intervenciones</h1>
                <p class="page-subtitle">Gestiona las acciones correctivas del centro</p>
            </div>
            <button class="btn btn-primary" onclick="alert('Registrar nueva intervención')">
                <span class="material-symbols-outlined">add_circle</span>
                Nueva Intervención
            </button>
        </header>
        
        <div class="content-wrapper">
            <div id="intervencionesTable" class="dashboard-card">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </main>
    
    <script src="common.js"></script>
    <script>
        async function loadIntervenciones() {
            try {
                const response = await fetch(`${API_URL}/api/intervenciones`);
                const intervenciones = await response.json();
                displayIntervenciones(intervenciones);
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function displayIntervenciones(intervenciones) {
            const container = document.getElementById('intervencionesTable');
            if (intervenciones.length === 0) {
                container.innerHTML = '<div class="empty-state"><span class="material-symbols-outlined">medical_services</span><p>No hay intervenciones registradas</p></div>';
                return;
            }
            
            container.innerHTML = `
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="border-bottom: 2px solid var(--border-color);">
                            <th style="padding: 1rem; text-align: left;">ID</th>
                            <th style="padding: 1rem; text-align: left;">Tipo</th>
                            <th style="padding: 1rem; text-align: left;">Seguimiento</th>
                            <th style="padding: 1rem; text-align: left;">Fecha</th>
                            <th style="padding: 1rem; text-align: left;">Estado</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${intervenciones.map(i => `
                            <tr style="border-bottom: 1px solid var(--border-color);">
                                <td style="padding: 1rem;">${i.id}</td>
                                <td style="padding: 1rem;">${i.tipo}</td>
                                <td style="padding: 1rem;">Seguimiento #${i.seguimientoId}</td>
                                <td style="padding: 1rem;">${formatDate(i.fechaRegistro)}</td>
                                <td style="padding: 1rem;">
                                    <span class="mascota-status status-${i.estado.toLowerCase().replace(' ', '-')}">
                                        ${i.estado}
                                    </span>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
        }
        
        document.addEventListener('DOMContentLoaded', loadIntervenciones);
    </script>
</body>
</html>
