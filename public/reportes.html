<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - HuellasResponsables</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="material-symbols-outlined">pets</span>
            <h2>HuellasResponsables</h2>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a href="mascotas.html" class="nav-item">
                <span class="material-symbols-outlined">pet_supplies</span>
                <span>Mascotas</span>
            </a>
            <a href="adoptantes.html" class="nav-item">
                <span class="material-symbols-outlined">group</span>
                <span>Adoptantes</span>
            </a>
            <a href="seguimientos.html" class="nav-item">
                <span class="material-symbols-outlined">assignment</span>
                <span>Seguimientos</span>
            </a>
            <a href="intervenciones.html" class="nav-item">
                <span class="material-symbols-outlined">medical_services</span>
                <span>Intervenciones</span>
            </a>
            <a href="reportes.html" class="nav-item active">
                <span class="material-symbols-outlined">description</span>
                <span>Reportes</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <span class="material-symbols-outlined">account_circle</span>
                <div>
                    <p id="userName" class="user-name">Admin Centro</p>
                    <p class="user-role">Administrador</p>
                </div>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Evaluación de Reportes</h1>
                <p class="page-subtitle">Revisa y evalúa los reportes de seguimiento</p>
            </div>
        </header>
        
        <div class="content-wrapper">
            <div class="filters-bar">
                <select id="filterReportes" class="filter-select" onchange="loadReportes()">
                    <option value="">Todos los reportes</option>
                    <option value="Pendiente">Pendientes</option>
                    <option value="Evaluado">Evaluados</option>
                    <option value="riesgo">Con Riesgo</option>
                </select>
            </div>
            
            <div id="reportesGrid" class="mascotas-grid">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </main>
    
    <script src="common.js"></script>
    <script>
        async function loadReportes() {
            try {
                const response = await fetch(`${API_URL}/api/reportes`);
                let reportes = await response.json();
                
                const filter = document.getElementById('filterReportes').value;
                if (filter === 'riesgo') {
                    reportes = reportes.filter(r => r.riesgo === true);
                } else if (filter) {
                    reportes = reportes.filter(r => r.estado === filter);
                }
                
                displayReportes(reportes);
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function displayReportes(reportes) {
            const grid = document.getElementById('reportesGrid');
            if (reportes.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><span class="material-symbols-outlined">description</span><p>No hay reportes</p></div>';
                return;
            }
            
            grid.innerHTML = reportes.map(r => `
                <div class="dashboard-card ${r.riesgo ? 'alert-card' : ''}">
                    <div class="card-header">
                        <h3><span class="material-symbols-outlined">description</span>Reporte #${r.id}</h3>
                        <span class="mascota-status status-${r.estado.toLowerCase()}">${r.estado}</span>
                    </div>
                    <div style="padding: 1rem;">
                        ${r.riesgo ? '<div style="color: var(--danger-color); font-weight: 600; margin-bottom: 1rem;"><span class="material-symbols-outlined">warning</span> ALERTA DE RIESGO</div>' : ''}
                        <p><strong>Seguimiento:</strong> #${r.seguimientoId}</p>
                        <p><strong>Fecha:</strong> ${formatDate(r.fechaEnvio)}</p>
                        ${r.calificacion ? `<p><strong>Calificación:</strong> ${r.calificacion}</p>` : ''}
                        ${r.observaciones ? `<p><strong>Observaciones:</strong> ${r.observaciones}</p>` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', loadReportes);
    </script>
</body>
</html>
