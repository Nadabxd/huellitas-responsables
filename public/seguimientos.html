<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguimientos - HuellasResponsables</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <span class="material-symbols-outlined">pets</span>
            <h2>HuellasResponsables</h2>
        </div>
        
        <nav class="sidebar-nav">
            <a href="dashboard.html" class="nav-item">
                <span class="material-symbols-outlined">dashboard</span>
                <span>Dashboard</span>
            </a>
            <a href="mascotas.html" class="nav-item">
                <span class="material-symbols-outlined">pet_supplies</span>
                <span>Mascotas</span>
            </a>
            <a href="adoptantes.html" class="nav-item">
                <span class="material-symbols-outlined">group</span>
                <span>Adoptantes</span>
            </a>
            <a href="seguimientos.html" class="nav-item active">
                <span class="material-symbols-outlined">assignment</span>
                <span>Seguimientos</span>
            </a>
            <a href="intervenciones.html" class="nav-item">
                <span class="material-symbols-outlined">medical_services</span>
                <span>Intervenciones</span>
            </a>
            <a href="reportes.html" class="nav-item">
                <span class="material-symbols-outlined">description</span>
                <span>Reportes</span>
            </a>
        </nav>
        
        <div class="sidebar-footer">
            <div class="user-info">
                <span class="material-symbols-outlined">account_circle</span>
                <div>
                    <p id="userName" class="user-name">Admin Centro</p>
                    <p class="user-role">Administrador</p>
                </div>
            </div>
            <button id="logoutBtn" class="btn-logout">
                <span class="material-symbols-outlined">logout</span>
            </button>
        </div>
    </aside>
    
    <!-- Main Content -->
    <main class="main-content">
        <header class="page-header">
            <div>
                <h1>Seguimiento Post-Adopción</h1>
                <p class="page-subtitle">Monitorea el bienestar de las mascotas adoptadas</p>
            </div>
            <button class="btn btn-primary" onclick="alert('Crear nuevo seguimiento')">
                <span class="material-symbols-outlined">add_task</span>
                Nuevo Seguimiento
            </button>
        </header>
        
        <div class="content-wrapper">
            <div id="seguimientosGrid" class="mascotas-grid">
                <!-- Content loaded dynamically -->
            </div>
        </div>
    </main>
    
    <script src="common.js"></script>
    <script>
        async function loadSeguimientos() {
            try {
                const response = await fetch(`${API_URL}/api/seguimientos`);
                const seguimientos = await response.json();
                displaySeguimientos(seguimientos);
            } catch (error) {
                console.error('Error:', error);
            }
        }
        
        function displaySeguimientos(seguimientos) {
            const grid = document.getElementById('seguimientosGrid');
            if (seguimientos.length === 0) {
                grid.innerHTML = '<div class="empty-state" style="grid-column: 1 / -1;"><span class="material-symbols-outlined">assignment</span><p>No hay seguimientos activos</p></div>';
                return;
            }
            
            grid.innerHTML = seguimientos.map(seg => `
                <div class="dashboard-card">
                    <div class="card-header">
                        <h3><span class="material-symbols-outlined">assignment</span>Seguimiento #${seg.id}</h3>
                        <span class="mascota-status status-activo">${seg.estado}</span>
                    </div>
                    <div style="padding: 1rem;">
                        <p><strong>Mascota ID:</strong> ${seg.mascotaId}</p>
                        <p><strong>Adoptante ID:</strong> ${seg.adoptanteId}</p>
                        <p><strong>Fecha inicio:</strong> ${formatDate(seg.fechaInicio)}</p>
                        <div style="margin-top: 1rem;">
                            <strong>Cronograma:</strong>
                            ${seg.cronograma.map(item => `
                                <div style="padding: 0.5rem; margin: 0.5rem 0; background: var(--bg-hover); border-radius: 8px;">
                                    <span>${item.descripcion}</span> - <small>${formatDate(item.fecha)}</small>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `).join('');
        }
        
        document.addEventListener('DOMContentLoaded', loadSeguimientos);
    </script>
</body>
</html>
